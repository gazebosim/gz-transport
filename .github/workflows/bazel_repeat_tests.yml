name: Bazel repeat tests
on:
  workflow_call:
    inputs: &shared_inputs
      flaky:
        description: "0 to execute non-flaky tests, 1 to execute flaky tests"
        default: 0
        required: false
        type: number
      runs_per_test:
        description: "Number of times to repeat each test"
        default: 10
        required: false
        type: number
  workflow_dispatch:
    inputs: *shared_inputs

jobs:
  repeat-tests:
    uses: bazel-contrib/.github/.github/workflows/bazel.yaml@v7.7.0
    with:
      # Make sure to keep in sync with version in root's .bazelversion
      bazel_versions: '["9.1.1"]'
      folders: |
        [
          "."
        ]
      exclude: |
        [
          {"folder": ".", "bzlmodEnabled": false}
        ]
      exclude_windows: true
      bazel_test_command: |
        # Exit with success code 0 if no targets match the query.
        # A failed query fails the job.
        targets=$(bazel query "attr(flaky, ${{ inputs.flaky }}, tests(//...))")
        [ -n "$targets" ] || { echo "No matching test targets"; exit 0; }
        # Same build flags as bazel.yml, to test the same binaries
        bazel test -c opt --repo_env=CC=clang --repo_env=CXX=clang++ \
            --runs_per_test=${{ inputs.runs_per_test }} \
            --test_output=errors \
            $targets
